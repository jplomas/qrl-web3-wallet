name: Release

# Drives semantic-release for qrl-web3-wallet and uploads the Chrome extension
# zip to the resulting GitHub Release.
#
# This package is `"private": true` and is *not* published to npm. No
# `@semantic-release/npm` plugin is configured. The release artifact is the
# Chrome extension zip uploaded here.
#
# CI (lint/test/build) runs separately via `ci.yml` on push and pull_request.

on:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'theQRL/qrl-web3-wallet'
    permissions:
      contents: write # push release commits and tags via semantic-release
      issues: write # semantic-release opens issues for release failures
      pull-requests: write # semantic-release comments on released PRs
    outputs:
      released: ${{ steps.check-release.outputs.released }}
      version: ${{ steps.check-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22.x'

      - name: Get current version (before semantic-release)
        id: version-before
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd  # v0.9.1
        with:
          ssh-private-key: ${{ secrets.BYPASS_SSH_KEY }}

      - name: Configure Git for SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Semantic Release (version, changelog, GitHub release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          # Exact versions, not major ranges. These run with `contents: write`
          # and the branch-protection bypass key in the ssh-agent, so a malicious
          # publish inside a `^` range would gain push access to main.
          # CIPH-QRLW326-12.
          npx --yes \
            -p semantic-release@24.2.9 \
            -p @semantic-release/changelog@6.0.3 \
            -p @semantic-release/exec@6.0.3 \
            -p @semantic-release/git@10.0.1 \
            -p conventional-changelog-conventionalcommits@8.0.0 \
            semantic-release --repository-url "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Check if release happened
        id: check-release
        env:
          OLD_VERSION: ${{ steps.version-before.outputs.version }}
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "Old version: $OLD_VERSION, New version: $NEW_VERSION"
          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          fi

  build-and-upload:
    name: Build extension + upload to release
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write # upload the Chrome extension zip to the GitHub Release
      id-token: write # OIDC token for build-provenance attestation
      attestations: write # write the provenance attestation
    steps:
      - name: Checkout (post-release main, includes the chore(release) commit)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Verify checked-out version matches release
        env:
          REL_VERSION: ${{ needs.release.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$REL_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match released version ($REL_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        # See CIPH-QRLW326-11 — the released artifact must be built from the
        # pinned tree, not a freshly-resolved one.
        run: npm ci

      # CIPH-QRLW326-10: the release path used to run no lint or test step and had
      # no dependency on ci.yml, so a red tree could ship. Gate here rather than
      # relying on a parallel workflow nobody waits for.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package zip
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p "qrl-web3-wallet-chrome-v${VERSION}"
          cp -r Extension/* "qrl-web3-wallet-chrome-v${VERSION}/"
          zip -r "qrl-web3-wallet-chrome-v${VERSION}.zip" "qrl-web3-wallet-chrome-v${VERSION}"
          ls -la "qrl-web3-wallet-chrome-v${VERSION}.zip"
          # Publish a checksum alongside the artifact so a swapped asset is
          # detectable. CIPH-QRLW326-13.
          sha256sum "qrl-web3-wallet-chrome-v${VERSION}.zip" \
            > "qrl-web3-wallet-chrome-v${VERSION}.zip.sha256"
          cat "qrl-web3-wallet-chrome-v${VERSION}.zip.sha256"

      # Build provenance for the artifact, using the `id-token: write` permission
      # the release job already declared but never used. Lets anyone verify the zip
      # was built by this workflow from this commit:
      #   gh attestation verify <zip> --repo theQRL/qrl-web3-wallet
      # CIPH-QRLW326-13.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: qrl-web3-wallet-chrome-v${{ needs.release.outputs.version }}.zip

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # No --clobber: replacing an already-published asset should be a
          # deliberate act, not a routine one. CIPH-QRLW326-13.
          gh release upload "v${VERSION}" \
            "qrl-web3-wallet-chrome-v${VERSION}.zip" \
            "qrl-web3-wallet-chrome-v${VERSION}.zip.sha256" \
            --repo "${GITHUB_REPOSITORY}"
