name: CI

# Lint, test, and build qrl-web3-wallet on push/PR.
#
# Release artifacts (the Chrome extension .zip) are produced by the
# `build-and-upload` job inside `release.yml`, which runs after semantic-release
# reports a new version. There is no separate `build.yaml`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` (not `npm install`) so the lockfile is enforced: `npm install`
        # treats it as advisory and re-resolves transitive `^` ranges, meaning the
        # tree CI tests need not be the pinned, audited one. `npm ci` additionally
        # fails outright if package.json and the lockfile disagree, so no separate
        # drift check is needed. CIPH-QRLW326-11.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
